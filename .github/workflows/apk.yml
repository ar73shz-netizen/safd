name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install npm dependencies
        run: npm install

      - name: Use a fixed debug signing key (keeps app updatable without data loss)
        run: |
          mkdir -p ~/.android
          cp android-debug.keystore ~/.android/debug.keystore

      - name: Add Android platform (if missing)
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi

      - name: Set app version (lets new APK install over the old one)
        run: |
          CODE=$(( $(date +%s) / 60 ))
          sed -i "s/versionCode [0-9][0-9]*/versionCode $CODE/; s/versionName \"[^\"]*\"/versionName \"2.$CODE\"/" android/app/build.gradle
          grep -n "versionCode\|versionName" android/app/build.gradle

      - name: Bundle Persian font (works offline)
        run: |
          mkdir -p www/fonts
          F=$(find node_modules/vazirmatn -name '*wght*.woff2' | head -1)
          if [ -z "$F" ]; then F=$(find node_modules/vazirmatn -name 'Vazirmatn-Regular.woff2' | head -1); fi
          echo "font: $F"
          [ -n "$F" ] && cp "$F" www/fonts/Vazirmatn.woff2 || true

      - name: Apply app icon (logo)
        run: cp -r resources/icons/. android/app/src/main/res/

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Make gradlew executable
        run: chmod +x android/gradlew

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: finance-app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
